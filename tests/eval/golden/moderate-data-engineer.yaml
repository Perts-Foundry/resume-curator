meta:
  id: moderate-data-engineer
  name: Data Engineer at DataFlow Systems
  eval_schema_version: 5
  tier: moderate
job_description: 'Data Engineer — DataFlow Systems (Austin, TX)

  DataFlow Systems builds real-time data infrastructure for e-commerce

  analytics companies. We are hiring a Data Engineer to design ETL pipelines,

  maintain our data warehouse, and build data models supporting 500+ business

  intelligence dashboards.

  Responsibilities:

  - Design and maintain ETL/ELT pipelines using dbt and Apache Airflow

  - Build and optimize data models in Snowflake for analytics workloads

  - Implement data quality frameworks with Great Expectations and dbt tests

  - Manage real-time data ingestion from 200+ event sources using Kafka

  - Build dimensional models and slowly changing dimension (SCD) patterns

  - Optimize query performance through materialized views and clustering keys

  - Implement data governance policies including PII masking and access controls

  Requirements:

  - 4+ years in data engineering or analytics engineering

  - Expert-level SQL and data modeling skills (star schema, snowflake schema)

  - Deep experience with dbt for transformation and testing

  - Hands-on Snowflake administration and optimization

  - Experience with orchestration tools (Airflow, Dagster, Prefect)

  - Proficiency in Python for data pipeline development

  - Understanding of data quality and observability patterns

  Nice to have:

  - Experience with real-time streaming (Kafka, Spark Structured Streaming)

  - Familiarity with data catalogs (Atlan, DataHub, Collibra)

  - dbt certification or Snowflake SnowPro certification

  - Experience with reverse ETL tools (Census, Hightouch)

  '
