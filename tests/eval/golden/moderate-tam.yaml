meta:
  id: moderate-tam
  name: Cloud Consultant / TAM at CloudBridge Consulting
  eval_schema_version: 5
  tier: moderate
job_description: 'Cloud Consultant / Technical Account Manager — CloudBridge Consulting
  (Remote)

  CloudBridge Consulting helps mid-market companies migrate to and optimize

  their cloud infrastructure. We are seeking a Cloud Consultant / TAM to

  serve as the primary technical advisor for a portfolio of 15 enterprise

  accounts with combined annual cloud spend of $8M.

  Responsibilities:

  - Serve as trusted technical advisor for 15 enterprise accounts

  - Conduct quarterly business reviews with C-level and VP stakeholders

  - Author statements of work (SOWs) and technical proposals for consulting engagements

  - Lead cloud architecture assessments and migration readiness evaluations

  - Deliver executive presentations on cloud strategy and cost optimization

  - Coordinate pre-sales technical discovery with prospective clients

  - Manage account health metrics including NPS, retention, and expansion revenue

  Requirements:

  - 5+ years in technical consulting, solutions architecture, or TAM roles

  - Strong AWS or Azure expertise with architecture review experience

  - Experience writing SOWs, RFPs, and technical proposals

  - Proven track record of managing enterprise client relationships

  - Excellent presentation and executive communication skills

  - Understanding of cloud migration frameworks (AWS MAP, Azure Migrate)

  - Experience with FinOps and cloud cost optimization advisory

  Nice to have:

  - AWS Solutions Architect Professional or Azure Solutions Architect Expert

  - Pre-sales or business development experience

  - Consulting certifications (e.g., TOGAF, ITIL)

  '
