job_description: 'Security Engineer (InfraSec) — Ironguard Security (Denver, CO)

  Ironguard Security provides managed security services for mid-market SaaS

  companies. We are looking for a Security Engineer to strengthen our

  infrastructure security posture, conduct penetration testing, and implement

  zero trust architectures.

  Responsibilities:

  - Perform penetration testing and vulnerability assessments on cloud infrastructure

  - Develop threat models for new product features and infrastructure changes

  - Implement zero trust network architecture across hybrid cloud environments

  - Build and maintain SIEM pipelines for security event correlation

  - Conduct OWASP Top 10 assessments for web applications and APIs

  - Automate security compliance checks using policy-as-code frameworks

  - Collaborate with DevOps teams on container security and image scanning

  Requirements:

  - 4+ years in security engineering, penetration testing, or infrastructure security

  - Hands-on experience with vulnerability scanners (Nessus, Qualys, Burp Suite)

  - Strong knowledge of OWASP Top 10 and common attack vectors

  - Experience implementing zero trust architectures (BeyondCorp, ZTNA)

  - Proficiency with SIEM tools (Splunk, Elastic Security, Sentinel)

  - Understanding of container security (Trivy, Falco, runtime scanning)

  - Experience with policy-as-code (OPA, Sentinel, AWS Config Rules)

  Nice to have:

  - OSCP, CEH, or equivalent offensive security certification

  - Experience with threat modeling frameworks (STRIDE, MITRE ATT&CK)

  - Background in compliance (SOC 2, ISO 27001, NIST 800-53)

  - Familiarity with cloud-native security tools (GuardDuty, Security Hub)

  '
