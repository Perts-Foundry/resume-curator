meta:
  id: moderate-compliance
  name: Compliance Engineer at AuditShield
  eval_schema_version: 4
  tier: moderate
job_description: 'Compliance Engineer — AuditShield (Washington, DC)

  AuditShield provides automated compliance and audit management software

  for government contractors and financial institutions. We are hiring a

  Compliance Engineer to implement and maintain regulatory frameworks

  across our cloud infrastructure and development processes.

  Responsibilities:

  - Implement and maintain SOC 2 Type II, FedRAMP, and ISO 27001 controls

  - Build automated compliance evidence collection pipelines

  - Conduct internal audits and prepare documentation for external auditors

  - Design and enforce GRC (Governance, Risk, and Compliance) policies

  - Manage vulnerability scanning and remediation tracking workflows

  - Author security policies, procedures, and compliance runbooks

  - Coordinate with legal and regulatory teams on framework interpretation

  Requirements:

  - 4+ years in compliance engineering, GRC, or security auditing

  - Deep expertise with SOC 2, FedRAMP, ISO 27001, or NIST 800-53 frameworks

  - Experience building automated compliance evidence collection

  - Proficiency with GRC platforms (Vanta, Drata, ServiceNow GRC)

  - Understanding of cloud security controls (AWS, Azure, or GCP)

  - Experience with vulnerability management tools (Qualys, Rapid7, Tenable)

  - Strong technical writing skills for policies and audit documentation

  Nice to have:

  - CISSP, CISA, or CCSK certification

  - Experience with CMMC or ITAR compliance

  - Background in government or defense contracting environments

  - Familiarity with policy-as-code tools (OPA, Sentinel)

  '
