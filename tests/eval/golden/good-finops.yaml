job_description: 'FinOps Engineer — CloudLedger (Chicago, IL)

  CloudLedger provides cloud financial management software for enterprise IT

  organizations. We are seeking a FinOps Engineer to build cost optimization

  tooling, implement chargeback models, and drive cloud spending accountability

  across engineering teams.

  Responsibilities:

  - Build dashboards and reports for cloud cost visibility across AWS accounts

  - Implement chargeback and showback models using tagging strategies and billing
  APIs

  - Optimize reserved instance and savings plan coverage to maximize discounts

  - Develop automation for rightsizing recommendations and idle resource cleanup

  - Analyze cost anomalies and create alerting for budget threshold breaches

  - Partner with engineering teams to embed cost-awareness into CI/CD workflows

  - Present monthly cost reviews and forecasting reports to leadership

  Requirements:

  - 4+ years in FinOps, cloud cost engineering, or infrastructure finance

  - Deep expertise with AWS Cost Explorer, Cost and Usage Reports, and billing APIs

  - Experience implementing reserved instance and savings plan strategies

  - Proficiency with tagging governance and multi-account cost allocation

  - Strong data analysis skills (Python, SQL, or BI tools)

  - Understanding of cloud pricing models (on-demand, spot, reserved, savings plans)

  - Experience building cost dashboards (Grafana, QuickSight, Tableau)

  Nice to have:

  - FinOps Certified Practitioner certification

  - Experience with Kubecost or cloud-native cost tools

  - Background in infrastructure engineering or DevOps

  - Familiarity with Terraform cost estimation (Infracost)

  '
