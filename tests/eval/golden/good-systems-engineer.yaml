job_description: 'Systems Engineer — CoreStack Systems (Raleigh, NC)

  CoreStack Systems provides hybrid infrastructure management for healthcare

  and financial services clients. We are looking for a Systems Engineer to

  manage Linux server fleets, configure networking, and maintain storage

  and backup systems across on-premises and cloud environments.

  Responsibilities:

  - Administer and maintain 500+ Linux servers (RHEL, Ubuntu, CentOS)

  - Configure and troubleshoot network infrastructure (VLANs, firewalls, DNS, DHCP)

  - Manage SAN/NAS storage systems and backup/recovery procedures

  - Implement configuration management using Ansible or Puppet at scale

  - Monitor system performance and capacity plan for growth

  - Harden servers per CIS and STIG benchmarks for compliance requirements

  - Collaborate with application teams on deployment and performance tuning

  Requirements:

  - 4+ years in systems engineering, systems administration, or infrastructure operations

  - Expert-level Linux administration (RHEL/CentOS/Ubuntu)

  - Strong networking fundamentals (TCP/IP, DNS, DHCP, routing, firewalls)

  - Experience with storage technologies (SAN, NAS, LVM, ZFS)

  - Proficiency with configuration management tools (Ansible, Puppet)

  - Understanding of backup and disaster recovery strategies

  - Scripting skills in Python and Bash for operational automation

  Nice to have:

  - RHCSA or RHCE certification

  - Experience with VMware vSphere or KVM virtualization

  - Background in bare-metal provisioning (PXE, Kickstart, Foreman)

  - Familiarity with cloud platforms (AWS, Azure) for hybrid deployments

  '
