job_description: 'Senior Container Platform Engineer — Cirrus Technologies (Seattle,
  WA)

  Cirrus Technologies is a cloud-native fintech company building a next-generation

  payments processing platform. We are looking for a Senior Container Platform

  Engineer to design and operate our Kubernetes-based infrastructure serving

  millions of daily transactions.

  Responsibilities:

  - Architect and maintain production Kubernetes clusters on EKS and GKE

  - Design and implement Helm chart libraries for standardized service deployments

  - Build container security scanning and admission control pipelines

  - Operate service mesh infrastructure using Istio for inter-service communication

  - Drive container image optimization and registry management across 60+ microservices

  - Mentor platform teams on Kubernetes best practices and troubleshooting

  Requirements:

  - 5+ years of experience in platform engineering or container orchestration

  - Deep expertise with Kubernetes (EKS, GKE) in production environments

  - Strong proficiency with Helm, Kustomize, and GitOps deployment workflows

  - Experience with container security tools (Trivy, Falco, OPA/Gatekeeper)

  - Hands-on experience with service mesh technologies (Istio, Linkerd)

  - Proficiency with AWS and GCP container services (EKS, ECS, GKE, Cloud Run)

  - Strong understanding of container networking, storage, and RBAC

  Nice to have:

  - CKA or CKAD certification

  - Experience building custom Kubernetes operators

  - Contributions to CNCF ecosystem projects

  '
