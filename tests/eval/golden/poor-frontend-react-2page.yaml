job_description: 'Frontend Engineer (React) — PixelCraft UI (San Francisco, CA)

  PixelCraft UI is a design-first product studio building accessible,

  high-performance web applications for the creative industry. We are

  looking for a Frontend Engineer to own our React component library

  and deliver pixel-perfect, responsive user interfaces.

  Responsibilities:

  - Build and maintain a shared React component library with TypeScript

  - Implement responsive layouts using CSS Grid, Flexbox, and Tailwind CSS

  - Ensure WCAG 2.1 AA accessibility compliance across all user-facing surfaces

  - Optimize rendering performance with React.memo, useMemo, and code splitting

  - Collaborate with designers to translate Figma mockups into production code

  - Write unit and integration tests with React Testing Library and Cypress

  - Manage global state using Redux Toolkit and React Query

  Requirements:

  - 3+ years of professional React development experience

  - Expert-level TypeScript in a React codebase

  - Deep understanding of CSS-in-JS, responsive design, and design systems

  - Experience with Redux, Context API, or Zustand for state management

  - Proficiency with accessibility tools (axe, Lighthouse, screen readers)

  - Experience with Storybook for component documentation

  - Familiarity with CI/CD for frontend builds (Vite, Webpack, esbuild)

  Nice to have:

  - Experience with Next.js or Remix for server-side rendering

  - Contributions to open source React component libraries

  - Background in motion design with Framer Motion or CSS animations

  - Experience with micro-frontend architectures

  '
