job_description: 'Data Scientist / ML Engineer — Neuralytix (Boston, MA)

  Neuralytix is an AI-native analytics company building predictive models

  for the healthcare industry. We are hiring a Data Scientist / ML Engineer

  to design, train, and deploy machine learning models that power clinical

  decision support tools.

  Responsibilities:

  - Design and train supervised and unsupervised ML models using TensorFlow and PyTorch

  - Build feature engineering pipelines with Apache Spark and Pandas

  - Conduct A/B experiments and apply Bayesian statistics to validate model performance

  - Deploy models to production via MLflow, SageMaker, or Vertex AI

  - Create data visualizations and dashboards using Matplotlib and Plotly

  - Collaborate with domain experts to define model objectives and success metrics

  - Write technical papers documenting methodology and experimental results

  Requirements:

  - MS or PhD in Statistics, Machine Learning, or a quantitative field

  - 4+ years of hands-on experience with TensorFlow, PyTorch, or scikit-learn

  - Strong foundation in probability, linear algebra, and statistical inference

  - Experience with feature stores and ML model registries

  - Proficiency in Python for data science (NumPy, Pandas, SciPy)

  - Experience with distributed computing (Spark, Dask, Ray)

  - Familiarity with experiment tracking (Weights & Biases, MLflow)

  Nice to have:

  - Publications in peer-reviewed ML conferences (NeurIPS, ICML, AAAI)

  - Experience with LLM fine-tuning and prompt engineering

  - Kaggle competition rankings

  - Healthcare domain knowledge (HIPAA, HL7 FHIR)

  '
