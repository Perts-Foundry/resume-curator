meta:
  id: poor-mobile-dev
  name: Mobile Developer at AppForge
  eval_schema_version: 4
  tier: poor
job_description: 'Mobile Developer — AppForge (Seattle, WA)

  AppForge is a venture-backed startup building the next generation of

  field service management tools for iOS and Android. We are looking for

  a Mobile Developer to build native mobile experiences that work

  offline-first in low-connectivity environments.

  Responsibilities:

  - Build native iOS applications using Swift and SwiftUI

  - Develop Android applications using Kotlin and Jetpack Compose

  - Implement offline-first data sync with Core Data and Room

  - Design responsive mobile UI following Human Interface Guidelines and Material
  Design

  - Integrate push notifications, geofencing, and background task scheduling

  - Optimize app performance for low-memory devices and slow networks

  - Publish and maintain apps on App Store and Google Play

  Requirements:

  - 3+ years of native mobile development (iOS or Android)

  - Proficiency in Swift and Kotlin

  - Experience with mobile CI/CD pipelines (Fastlane, Bitrise, App Center)

  - Understanding of mobile security (certificate pinning, secure storage)

  - Familiarity with RESTful API consumption and GraphQL clients

  - Experience with mobile testing frameworks (XCTest, Espresso, Detox)

  - Knowledge of mobile analytics (Firebase, Amplitude)

  Nice to have:

  - Published apps with 10,000+ downloads

  - Experience with Flutter or React Native for cross-platform development

  - Background in BLE (Bluetooth Low Energy) integration

  - Experience with ARKit or ARCore

  '
