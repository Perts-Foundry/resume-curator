job_description: 'Senior DevOps Engineer — Nexus Systems (Austin, TX)

  Nexus Systems is a fast-growing SaaS platform providing real-time analytics

  for the logistics industry. We are seeking a Senior DevOps Engineer to own

  our cloud infrastructure, CI/CD pipelines, and platform reliability.

  Responsibilities:

  - Design and maintain AWS-based infrastructure using Terraform and CloudFormation

  - Build and optimize CI/CD pipelines for 50+ microservices

  - Implement container orchestration with Kubernetes and ECS

  - Establish monitoring, alerting, and incident response processes

  - Drive infrastructure-as-code adoption across engineering teams

  - Collaborate with security teams on compliance and access controls

  - Mentor junior engineers on cloud architecture best practices

  Requirements:

  - 5+ years of experience in DevOps, SRE, or platform engineering

  - Strong expertise with AWS (EC2, EKS, RDS, Lambda, S3, IAM)

  - Proficiency with Terraform, Ansible, or similar IaC tools

  - Hands-on Kubernetes experience in production environments

  - Experience building CI/CD pipelines with GitHub Actions, Jenkins, or GitLab CI

  - Proficiency in Python or Go for tooling and automation

  - Strong understanding of networking, DNS, TLS, and load balancing

  - Experience with monitoring stacks (Prometheus, Grafana, Datadog)

  Nice to have:

  - AWS certifications (Solutions Architect, DevOps Engineer)

  - Experience with service mesh (Istio, Linkerd)

  - Contributions to open source infrastructure projects

  - Experience migrating workloads from on-premises to cloud

  '
