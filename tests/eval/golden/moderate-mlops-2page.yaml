job_description: 'MLOps Engineer — ModelForge AI (Seattle, WA)

  ModelForge AI provides enterprise machine learning platforms for healthcare

  and life sciences companies. We are hiring an MLOps Engineer to build and

  maintain ML pipelines, model serving infrastructure, and feature stores

  for production AI workloads.

  Responsibilities:

  - Design and maintain ML training pipelines using Kubeflow and Airflow

  - Build model serving infrastructure with Seldon Core and KServe on Kubernetes

  - Implement feature stores using Feast for real-time and batch feature serving

  - Manage GPU cluster scheduling and resource optimization on EKS

  - Build experiment tracking and model registry infrastructure (MLflow, Weights &
  Biases)

  - Implement data versioning and lineage tracking for model reproducibility

  - Automate model validation, A/B testing, and progressive rollout pipelines

  Requirements:

  - 4+ years in MLOps, ML infrastructure, or platform engineering for ML

  - Hands-on experience with ML pipeline frameworks (Kubeflow, Airflow, Vertex AI)

  - Kubernetes experience for ML workloads (GPU scheduling, node affinity)

  - Experience with model serving frameworks (Seldon, TFServing, Triton)

  - Proficiency in Python with ML ecosystem (PyTorch, TensorFlow, scikit-learn)

  - Understanding of feature engineering and feature store architectures

  - Experience with experiment tracking platforms (MLflow, W&B, Neptune)

  Nice to have:

  - Experience in healthcare or regulated ML environments

  - Familiarity with data versioning tools (DVC, LakeFS)

  - Background in distributed training (Horovod, PyTorch Distributed)

  - AWS SageMaker or Google Vertex AI experience

  '
