job_description: 'Release / Build Engineer — ShipFast (San Francisco, CA)

  ShipFast provides developer productivity tooling for enterprise software teams.

  We are looking for a Release Engineer to own our build systems, artifact

  management, and release pipelines across 80+ repositories.

  Responsibilities:

  - Design and maintain reproducible build systems using Bazel and Buck2

  - Manage artifact repositories (Artifactory, Nexus) for versioned releases

  - Implement semantic versioning and automated changelog generation

  - Build release pipelines with progressive rollout and rollback capabilities

  - Optimize build times through caching, parallelization, and dependency analysis

  - Maintain package registries for internal libraries (PyPI, npm, Maven)

  - Integrate code signing and provenance attestation into release workflows

  Requirements:

  - 4+ years in release engineering, build engineering, or CI/CD

  - Deep expertise with build systems (Bazel, Gradle, Make, CMake)

  - Experience with artifact management (Artifactory, Nexus, GitHub Packages)

  - Strong understanding of semantic versioning and release branching strategies

  - Proficiency with CI/CD platforms (GitHub Actions, Jenkins, CircleCI)

  - Experience with container image builds and multi-arch support

  - Python or Go scripting for build automation tooling

  Nice to have:

  - Experience with monorepo build optimization

  - Familiarity with supply chain security (SLSA, Sigstore)

  - Contributions to build system tooling or plugins

  '
