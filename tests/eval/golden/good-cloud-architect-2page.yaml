job_description: 'Cloud Solutions Architect — Pinnacle Labs (Seattle, WA)

  Pinnacle Labs is a product-led consultancy helping enterprises modernize

  their cloud infrastructure. We are hiring a Cloud Solutions Architect to

  lead design reviews, cost modeling, and migration planning for AWS-native

  workloads.

  Responsibilities:

  - Conduct AWS Well-Architected Framework reviews for client environments

  - Design multi-account landing zone architectures with guardrails

  - Build reference architectures for high-availability, multi-region deployments

  - Develop cost models and TCO analyses for cloud migration proposals

  - Author infrastructure decision records and present to executive stakeholders

  - Evaluate service selection trade-offs (RDS vs Aurora, ECS vs EKS, Lambda vs Fargate)

  - Collaborate with security and compliance teams on shared responsibility models

  Requirements:

  - 6+ years in cloud architecture or infrastructure engineering

  - AWS Solutions Architect Professional certification (required)

  - Deep expertise in VPC design, IAM policy authoring, and multi-account strategies

  - Experience with cost optimization (Reserved Instances, Savings Plans, rightsizing)

  - Proficiency with Terraform or CloudFormation for large-scale IaC

  - Strong written and verbal communication for client-facing deliverables

  - Familiarity with the AWS Well-Architected Framework pillars

  Nice to have:

  - Experience with FinOps practices and cloud billing APIs

  - Knowledge of compliance frameworks (SOC 2, HIPAA, FedRAMP)

  - Background in system design interviews or architecture review boards

  '
