job_description: 'Automation Engineer — FlowWorks (Portland, OR)

  FlowWorks builds workflow orchestration software for manufacturing and

  logistics companies. We are looking for an Automation Engineer to design

  scripting frameworks, build test automation suites, and optimize CI/CD

  pipelines for our platform.

  Responsibilities:

  - Design and maintain Python and Bash scripting frameworks for build automation

  - Build end-to-end test automation suites covering API and UI workflows

  - Optimize CI/CD pipelines to reduce build times and improve release cadence

  - Develop workflow orchestration scripts for data processing pipelines

  - Create self-healing automation for infrastructure provisioning and teardown

  - Integrate third-party tools and APIs into unified automation workflows

  - Document automation standards and train engineering teams on best practices

  Requirements:

  - 4+ years in automation engineering, DevOps, or test automation

  - Expert-level Python and Bash scripting for infrastructure and build automation

  - Experience with CI/CD platforms (GitHub Actions, Jenkins, GitLab CI)

  - Proficiency with configuration management (Ansible, Puppet, Chef)

  - Hands-on experience with containerized build environments (Docker)

  - Knowledge of REST API integration and webhook-driven workflows

  - Strong debugging and root cause analysis skills

  Nice to have:

  - Experience with workflow orchestration tools (Airflow, Prefect, Temporal)

  - Background in test frameworks (pytest, Selenium, Playwright)

  - Familiarity with infrastructure-as-code (Terraform, CloudFormation)

  - Knowledge of event-driven architectures and message queues

  '
