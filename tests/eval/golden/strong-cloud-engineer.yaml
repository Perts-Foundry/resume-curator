job_description: 'Cloud Engineer — Vantage Cloud (Denver, CO)

  Vantage Cloud is a mid-stage startup building a multi-cloud data analytics

  platform for the healthcare industry. We are hiring a Cloud Engineer to

  design, automate, and optimize our AWS and GCP infrastructure powering

  real-time patient data pipelines.

  Responsibilities:

  - Design and implement multi-cloud infrastructure across AWS and GCP

  - Architect VPC topologies, IAM policies, and network security controls

  - Build cloud migration runbooks and execute workload transitions

  - Automate infrastructure provisioning using Terraform and CloudFormation

  - Optimize cloud spend through rightsizing, reserved capacity, and tagging strategies

  - Collaborate with compliance teams on HIPAA-aligned cloud architecture

  Requirements:

  - 4+ years of experience in cloud engineering or infrastructure roles

  - Strong expertise with AWS (VPC, IAM, EC2, RDS, S3, Lambda, CloudFormation)

  - Hands-on experience with GCP (Compute Engine, Cloud SQL, GKE, IAM)

  - Proficiency with Terraform for multi-cloud infrastructure management

  - Experience designing VPC peering, Transit Gateway, and hybrid connectivity

  - Understanding of cloud security best practices and compliance frameworks

  Nice to have:

  - AWS Solutions Architect or GCP Professional Cloud Architect certification

  - Experience with healthcare compliance (HIPAA, HITRUST)

  - Familiarity with FinOps practices and cloud cost optimization tools

  '
