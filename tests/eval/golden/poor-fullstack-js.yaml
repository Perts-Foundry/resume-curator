  name: Full-stack Engineer (JS) at StackBridge
  eval_schema_version: 4
  tier: poor
job_description: 'Full-stack Engineer (JavaScript) — StackBridge (Denver, CO)

  StackBridge is a B2B SaaS company building collaborative project

  management tools for distributed engineering teams. We are seeking a

  Full-stack Engineer to build features end-to-end using our modern

  JavaScript stack.

  Responsibilities:

  - Build RESTful and GraphQL APIs using Node.js and Express

  - Develop interactive frontend components with React and TypeScript

  - Design and optimize MongoDB schemas and aggregation pipelines

  - Implement real-time collaboration features using WebSockets and Socket.io

  - Write comprehensive test suites with Jest, Mocha, and Playwright

  - Deploy and monitor services on Vercel and AWS Lambda

  - Participate in architecture reviews and technical design documents

  Requirements:

  - 4+ years of full-stack JavaScript/TypeScript development

  - Strong experience with Node.js backend development (Express, Fastify, Nest.js)

  - Proficiency with React, Next.js, and modern frontend tooling

  - Experience with MongoDB, Mongoose, and NoSQL data modeling

  - Familiarity with message queues (RabbitMQ, SQS, Redis Pub/Sub)

  - Experience with OAuth 2.0, JWT, and session management

  - Understanding of serverless architectures and edge computing

  Nice to have:

  - Experience with Prisma or Drizzle ORM

  - Contributions to npm packages with significant download counts

  - Background in real-time collaboration (CRDTs, operational transforms)

  - Experience with monorepo tooling (Turborepo, Nx)

  '
