job_description: 'Production Engineer — ScaleCore (New York, NY)

  ScaleCore operates a high-throughput event streaming platform processing

  2 billion events daily for media and advertising clients. We need a

  Production Engineer to ensure system reliability through code-level

  debugging, capacity planning, and performance optimization.

  Responsibilities:

  - Debug and resolve complex production issues in distributed Java/Scala services

  - Perform capacity planning and load modeling for event streaming workloads

  - Optimize JVM performance, garbage collection, and memory allocation

  - Build internal tools for automated canary analysis and traffic shifting

  - Conduct performance profiling using async-profiler, perf, and flamegraphs

  - Collaborate with application teams to improve service resilience patterns

  - Manage Kafka clusters handling 2 million messages per second

  Requirements:

  - 4+ years in production engineering, SRE, or systems engineering

  - Strong debugging skills in JVM-based languages (Java, Scala, Kotlin)

  - Deep understanding of distributed systems (consensus, partitioning, CAP theorem)

  - Experience with event streaming platforms (Kafka, Kinesis, Pulsar)

  - Proficiency in capacity planning and performance modeling

  - Linux systems internals (memory, networking, I/O subsystems)

  - Experience with performance profiling tools and methodologies

  Nice to have:

  - Experience with eBPF for production observability

  - Contributions to Kafka or similar open source streaming platforms

  - Background in high-frequency or real-time data processing

  '
