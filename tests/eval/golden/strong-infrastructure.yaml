job_description: 'Infrastructure Engineer — Atlas Digital (Chicago, IL)

  Atlas Digital is an enterprise SaaS company providing workforce management

  solutions to the retail and hospitality industries. We are hiring an

  Infrastructure Engineer to design, build, and maintain our AWS-based

  production infrastructure spanning multiple regions and serving 2,000+

  enterprise customers.

  Responsibilities:

  - Design and implement VPC architectures with Transit Gateway and multi-account
  strategies

  - Build and maintain CloudFormation and Terraform templates for infrastructure provisioning

  - Architect EC2 fleet management with auto-scaling groups and launch templates

  - Configure network security controls including security groups, NACLs, and WAF
  rules

  - Implement automated patching, backup, and disaster recovery workflows

  - Optimize network performance through Direct Connect, CloudFront, and Route 53
  tuning

  Requirements:

  - 4+ years of experience in infrastructure engineering or cloud operations

  - Strong expertise with AWS networking (VPC, Transit Gateway, Direct Connect, Route
  53)

  - Proficiency with infrastructure-as-code tools (CloudFormation, Terraform)

  - Hands-on experience managing EC2 fleets at scale (500+ instances)

  - Understanding of network fundamentals (TCP/IP, DNS, BGP, TLS, load balancing)

  - Experience with automated patching and configuration management (Ansible, SSM)

  Nice to have:

  - AWS Networking Specialty or Solutions Architect certification

  - Experience with hybrid cloud connectivity (VPN, Direct Connect)

  - Familiarity with network monitoring tools (VPC Flow Logs, CloudWatch)

  '
