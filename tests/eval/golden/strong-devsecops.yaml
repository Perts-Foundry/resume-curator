job_description: 'DevSecOps Engineer — Sentinel Security (Washington, DC)

  Sentinel Security is a cybersecurity consulting firm serving federal agencies

  and Fortune 500 companies. We are seeking a DevSecOps Engineer to embed

  security practices into CI/CD pipelines, cloud infrastructure, and

  container workloads across our client engagements.

  Responsibilities:

  - Integrate security scanning (SAST, DAST, SCA) into CI/CD pipelines

  - Design and enforce IAM policies, RBAC controls, and least-privilege access

  - Implement secrets management solutions using Vault, AWS Secrets Manager, or similar

  - Build vulnerability scanning and remediation workflows for container images

  - Develop compliance-as-code frameworks for FedRAMP, SOC 2, and NIST 800-53

  - Configure SIEM integrations and automated incident response playbooks

  Requirements:

  - 5+ years of experience in DevSecOps, security engineering, or DevOps with security
  focus

  - Deep expertise with AWS security services (IAM, GuardDuty, Security Hub, Config)

  - Experience implementing secrets management at scale (HashiCorp Vault, AWS Secrets
  Manager)

  - Proficiency with vulnerability scanning tools (Trivy, Snyk, Aqua, Qualys)

  - Hands-on experience with SIEM platforms (Splunk, Elastic Security, Sentinel)

  - Strong understanding of compliance frameworks (FedRAMP, SOC 2, NIST, CIS)

  Nice to have:

  - Security certifications (CISSP, CEH, AWS Security Specialty)

  - Experience with OPA/Gatekeeper for policy enforcement

  - Background in federal/defense security clearance environments

  '
