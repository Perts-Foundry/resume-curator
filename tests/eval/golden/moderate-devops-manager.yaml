meta:
  id: moderate-devops-manager
  name: DevOps Manager at TeamOps
  eval_schema_version: 4
  tier: moderate
job_description: 'DevOps Manager — TeamOps (Chicago, IL)

  TeamOps is a workforce management SaaS company serving 2,000+ enterprise

  clients. We are hiring a DevOps Manager to lead a team of 8 engineers,

  own our infrastructure budget, and drive platform reliability initiatives.

  Responsibilities:

  - Manage and mentor a team of 8 DevOps and SRE engineers

  - Own $2.5M annual cloud infrastructure budget with quarterly forecasting

  - Conduct hiring, performance reviews, and career development planning

  - Define team OKRs aligned with engineering and business objectives

  - Partner with VP of Engineering on infrastructure strategy and roadmap

  - Establish team processes for incident management and change control

  - Drive vendor evaluations and contract negotiations for infrastructure tooling

  Requirements:

  - 3+ years of engineering management experience leading DevOps/SRE teams

  - 5+ years hands-on DevOps or infrastructure experience

  - Experience with budget ownership and cloud cost management

  - Track record of hiring and growing engineering talent

  - Strong understanding of CI/CD, IaC, and container orchestration

  - Experience with agile methodologies and engineering metrics (DORA)

  - Excellent communication skills for cross-functional stakeholder management

  Nice to have:

  - MBA or engineering management certification

  - Experience managing distributed/remote teams

  - Background in SaaS or enterprise software platforms

  - Familiarity with FinOps practices and frameworks

  '
