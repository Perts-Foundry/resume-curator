meta:
  id: poor-dba
  name: Database Administrator at DataVault
  eval_schema_version: 4
  tier: poor
job_description: 'Database Administrator — DataVault (Chicago, IL)

  DataVault is an enterprise data management company providing secure,

  high-availability database solutions for financial services clients.

  We are seeking a Database Administrator to own our production database

  fleet and ensure maximum uptime, performance, and compliance.

  Responsibilities:

  - Administer and tune PostgreSQL and Oracle database clusters in production

  - Design and implement query optimization strategies for complex analytical workloads

  - Manage database backup, point-in-time recovery, and replication topologies

  - Implement row-level security, encryption at rest, and audit logging

  - Plan and execute database migrations and major version upgrades with zero downtime

  - Build automated health monitoring and alerting for 200+ database instances

  - Create capacity planning models and storage forecasting reports

  Requirements:

  - 5+ years of hands-on database administration (PostgreSQL required, Oracle preferred)

  - Expert-level SQL tuning (EXPLAIN ANALYZE, index strategies, partitioning)

  - Experience with logical and physical replication (Patroni, pgBouncer, Citus)

  - Proficiency with backup tools (pg_dump, pgBackRest, RMAN)

  - Understanding of database security (TDE, SSL, pg_audit)

  - Experience with database-as-a-service platforms (RDS, Cloud SQL, Azure Database)

  - Familiarity with database observability (pganalyze, Datadog Database Monitoring)

  Nice to have:

  - Oracle Certified Professional (OCP) certification

  - Experience with time-series databases (TimescaleDB, InfluxDB)

  - Background in financial services compliance (SOX, PCI DSS)

  - Experience migrating from Oracle to PostgreSQL

  '
