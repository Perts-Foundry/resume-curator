job_description: 'Product Manager — LaunchPad Products (New York, NY)

  LaunchPad Products is a consumer technology company building subscription

  commerce platforms for the direct-to-consumer market. We are hiring a

  Product Manager to own our core checkout and retention product lines.

  Responsibilities:

  - Define product roadmaps and quarterly OKRs aligned with company strategy

  - Conduct user research interviews and synthesize findings into actionable insights

  - Write detailed PRDs with user stories, acceptance criteria, and wireframes

  - Prioritize feature backlog using RICE scoring and stakeholder alignment

  - Run sprint planning, backlog grooming, and retrospective ceremonies

  - Analyze product metrics (conversion funnels, retention cohorts, NPS) to drive
  decisions

  - Present product strategy to executive leadership and board of directors

  Requirements:

  - 4+ years of product management experience in consumer technology

  - Experience with product analytics tools (Amplitude, Mixpanel, Heap)

  - Proficiency with design collaboration tools (Figma, Miro, FigJam)

  - Strong understanding of A/B testing frameworks and statistical significance

  - Experience writing SQL queries for ad-hoc product analysis

  - Familiarity with agile frameworks (Scrum, Kanban, SAFe)

  - Excellent stakeholder communication and presentation skills

  Nice to have:

  - MBA or equivalent business background

  - Experience with subscription/recurring revenue business models

  - Background in e-commerce or payments (Stripe, Braintree)

  - Certified Scrum Product Owner (CSPO) designation

  '
