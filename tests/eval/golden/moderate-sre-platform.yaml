meta:
  id: moderate-sre-platform
  name: Senior SRE / Platform Engineer at Uptime Labs
  eval_schema_version: 4
  tier: moderate
job_description: 'Senior Site Reliability Engineer — Uptime Labs (Denver, CO)

  Uptime Labs builds high-availability payment processing infrastructure for

  financial services companies. We are hiring a Senior SRE to own service

  reliability, define SLOs, and lead incident response for our distributed

  platform serving 50 million transactions daily.

  Responsibilities:

  - Define and maintain SLOs and error budgets for 30+ production services

  - Lead incident response and blameless post-mortems for P1/P2 events

  - Build and maintain Prometheus-based monitoring with custom exporters

  - Manage on-call rotations and escalation policies across 4 engineering teams

  - Implement chaos engineering practices to validate resilience

  - Automate toil reduction through SRE tooling in Go and Python

  - Capacity planning and performance modeling for payment processing workloads

  Requirements:

  - 5+ years in SRE, platform engineering, or production systems

  - Deep expertise with SLO frameworks, error budgets, and reliability metrics

  - Hands-on Prometheus, Thanos, and Grafana at scale

  - Strong incident command and post-mortem facilitation skills

  - Experience with chaos engineering tools (Chaos Monkey, Litmus, Gremlin)

  - Proficiency in Go for custom tooling and exporters

  - Kubernetes experience in high-throughput production environments

  - On-call experience with PagerDuty or Opsgenie

  Nice to have:

  - Experience in financial services or payment processing

  - Google SRE certification or equivalent

  - Familiarity with distributed tracing (Jaeger, OpenTelemetry)

  '
