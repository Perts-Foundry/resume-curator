[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curator"]

[project]
name = "resume-curator"
version = "0.1.0"
description = "AI-powered resume curation CLI"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=0.40",
    "loguru>=0.7",
    "pdfplumber>=0.11",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.14.2,<3",
    "pypdf>=6.10.2,<7",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.9"]

[project.scripts]
curator = "curator.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pre-commit>=3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
    "ruff>=0.4",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "S", "C4",
    "SIM", "PTH", "RET", "T20", "EM", "FA", "ISC", "ICN",
    "TC", "TID", "D", "PT", "PERF", "FURB", "RUF",
]
ignore = ["D100", "D104", "D203", "D213", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "D", "ANN", "ARG"]
"scripts/**/*.py" = ["T201", "D"]
"__init__.py" = ["F401", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["curator"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyperclip.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false
# EvalMetricResult.value is a union; tests know the per-metric runtime
# type and assert against it directly. Suppress only the two error codes
# this directly produces (operator on union, index on union); leave
# call-overload and arg-type strict so test code still catches genuine
# API misuse against production functions.
disable_error_code = ["operator", "index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra", "-m", "not llm"]
markers = [
    "unit: Fast, isolated tests",
    "integration: Tests requiring external services",
    "e2e: End-to-end pipeline tests",
    "slow: Tests taking more than a few seconds",
    "eval: Evaluation framework tests",
    "golden: Golden dataset regression tests (subset of eval)",
    "llm: Tests requiring real LLM API calls (costs money, never in default CI)",
]

[tool.coverage.run]
source = ["src/curator"]
branch = true
omit = ["tests/*", "**/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
